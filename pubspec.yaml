name: uth_todo
description: Bài tập Flutter UTH Todo - Firebase Auth, Firestore, FCM.
publish_to: none
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^7.2.0
  firebase_messaging: ^17.0.1
  firebase_analytics: ^13.0.1
  firebase_remote_config: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
